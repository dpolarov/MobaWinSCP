name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Build MobaWinSCP
        run: go build -trimpath -ldflags "-s -w" -o MobaWinSCP.exe ./cmd/mobawinscp
      - name: Build MSAA diagnostic
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /reference:Accessibility.dll /out:MsaaDump.exe tools\MsaaDump.cs
      - name: Build MobaProbe diagnostic
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio installation not found" }
          $csc = Join-Path $vs "MSBuild\Current\Bin\Roslyn\csc.exe"
          if (-not (Test-Path $csc)) { throw "Roslyn csc.exe not found: $csc" }
          & $csc /nologo /reference:System.Management.dll /out:MobaProbe.exe tools\MobaProbe.cs
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: MobaWinSCP-windows-amd64
          path: MobaWinSCP.exe
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: MsaaDump-windows-amd64
          path: MsaaDump.exe
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: MobaProbe-windows-amd64
          path: MobaProbe.exe

  release:
    name: Publish tagged binaries to Releases
    needs: test-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-dist -type f -name '*.exe' -print0)
          test "${#assets[@]}" -gt 0 || { echo "No EXEs found"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "MobaWinSCP $GITHUB_REF_NAME" --generate-notes
